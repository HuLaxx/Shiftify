<path d="M15 42H160" stroke="#965b66"/>
<text x="15" y="61" fill="#87405c" font-family="monospace" font-size="11">IMPORT · REVIEW</text>
<text x="15" y="77" fill="#87405c" font-family="monospace" font-size="11">EXPORT · TRANSFER</text>
</g>
<g font-family="monospace" font-size="10.5" letter-spacing="1.1" fill="#e3c4ef">
<text x="62" y="390">LIBRARY RECORDS / IMPORT · REVIEW · MOVE</text>
<text x="62" y="427" fill="#aa91bd" font-size="10">ORIGINAL CONCEPT ART — NO LIVE TRACK DATA OR AUDIO PLAYBACK</text>
<text x="1142" y="427" text-anchor="end" fill="#aa91bd" font-size="10">ISSUE 004 / SHIFTIFY</text>
</g>
</g>
</svg>