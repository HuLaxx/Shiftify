<text x="34" y="469" fill="#805c75" font-family="monospace" font-size="12">PRIVACY NOTE / Do not paste login cookies into an untrusted hosted deployment.</text>
<text x="34" y="497" fill="#a27b8e" font-family="monospace" font-size="11">Illustration of source-level behaviour; not evidence of authenticated security, data isolation or production readiness.</text>
