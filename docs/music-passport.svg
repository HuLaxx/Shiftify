<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 445" role="img" aria-labelledby="tt dd">
<title id="tt">Shiftify — The Music Passport</title>
<desc id="dd">Original animated editorial music sleeve: a rotating violet vinyl record, dancing abstract equalizer lines, music-library cards and portable track-file symbols. The illustration does not play music or show actual transferred tracks.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#100b25"/><stop offset=".54" stop-color="#26103e"/><stop offset="1" stop-color="#14142f"/></linearGradient>
 <linearGradient id="sunrise" x1="0" x2="1"><stop stop-color="#ffc09f"/><stop offset=".52" stop-color="#f7a9d0"/><stop offset="1" stop-color="#bca3fa"/></linearGradient>
 <radialGradient id="disc"><stop stop-color="#7658aa"/><stop offset=".35" stop-color="#372b67"/><stop offset=".65" stop-color="#231845"/><stop offset="1" stop-color="#4e3683"/></radialGradient>
 <pattern id="noise" width="42" height="42" patternUnits="userSpaceOnUse"><circle cx="7" cy="9" r="1" fill="#e9d5fa" opacity=".1"/><circle cx="34" cy="28" r=".6" fill="#f5c6d9" opacity=".16"/></pattern>
 <clipPath id="frame"><rect width="1200" height="445" rx="22"/></clipPath>
 <clipPath id="crop"><circle cx="838" cy="213" r="162"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="445" fill="url(#bg)"/><rect width="1200" height="445" fill="url(#noise)"/>
<path d="M0 55H1200M0 403H1200" stroke="#c8a8ec" stroke-opacity=".25"/>
<rect x="36" y="76" width="525" height="289" rx="16" fill="#fff8f0" fill-opacity=".038" stroke="#e4b3e3" stroke-opacity=".28"/>
<g font-family="Arial,Helvetica,sans-serif">
 <rect x="60" y="98" width="174" height="27" rx="13.5" fill="#f5aad8" fill-opacity=".14" stroke="#f7aad3" stroke-opacity=".62"/>
 <text x="74" y="116" fill="#ffd2e9" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.3">HULAX STUDIO / 004</text>
 <text x="57" y="211" fill="#fff3ee" font-size="79" font-weight="800" letter-spacing="-5">Shiftify</text>
 <rect x="61" y="231" width="355" height="3" rx="2" fill="url(#sunrise)"/>
 <text x="60" y="272" fill="#ffc6ad" font-size="24" font-weight="700" letter-spacing="1.1">THE MUSIC PASSPORT</text>
 <text x="61" y="306" fill="#dccce9" font-size="16">Your library is more than one destination.</text>
 <text x="61" y="329" fill="#dccce9" font-size="16">Make the journey yours.</text>
</g>
<!-- Record sleeve -->
<rect x="704" y="47" width="292" height="331" rx="12" fill="#f8dcca" fill-opacity=".09" stroke="#f7b8cb" stroke-opacity=".4"/>
<rect x="717" y="62" width="265" height="300" rx="7" fill="#b47ad0" fill-opacity=".12"/>
<circle cx="838" cy="213" r="167" fill="#09091d" stroke="#d4a5f8" stroke-opacity=".53" stroke-width="2"/>
<g clip-path="url(#crop)">
 <g>
 <circle cx="838" cy="213" r="162" fill="url(#disc)"/>
 <circle cx="838" cy="213" r="151" fill="none" stroke="#eed5ff" stroke-opacity=".28" stroke-width="1.4"/>
 <circle cx="838" cy="213" r="135" fill="none" stroke="#f3b6d9" stroke-opacity=".3" stroke-width="1"/>
 <circle cx="838" cy="213" r="119" fill="none" stroke="#e3bbf9" stroke-opacity=".25" stroke-width="1.5"/>
