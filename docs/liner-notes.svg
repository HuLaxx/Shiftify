<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" role="img" aria-labelledby="t d">
<title id="t">Shiftify liner notes — two ways through the music library</title>
<desc id="d">An editorial fold-out process sheet. Standard file workflow: CSV, JSON or track lines are submitted to server-side parser and SQLite storage, reviewed, and exported as a CSV report. Advanced YouTube Music account-to-account flow submits account session cookies through an API server, requiring a trusted deployment. Concept diagram, not product screenshot.</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5ea"/><stop offset=".55" stop-color="#ffe9de"/><stop offset="1" stop-color="#f2e5fc"/></linearGradient>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#aa85a5" opacity=".12"/></pattern>
 <clipPath id="clip"><rect width="1160" height="520" rx="19"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1160" height="520" fill="url(#paper)"/><rect width="1160" height="520" fill="url(#dots)"/>
<rect width="1160" height="12" fill="#502f65"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="33" y="54" fill="#462957" font-weight="800" font-size="31" letter-spacing="-.5">LINER NOTES</text>
<text x="34" y="77" fill="#90677f" font-family="monospace" font-size="13" letter-spacing=".6">TWO DIFFERENT FLOWS. TWO DIFFERENT PRIVACY BOUNDARIES.</text>
</g>
