 <circle cx="838" cy="213" r="68" fill="none" stroke="#fbd7b5" stroke-opacity=".26" stroke-width="1"/>
 <path d="M838 53V373M678 213H998" stroke="#fbcac7" stroke-opacity=".13" stroke-width="2"/>
 <g>
 <path d="M838 58A155 155 0 0 1 993 213" stroke="#ffe0ae" stroke-width="8" stroke-linecap="round" opacity=".85"/>
 <path d="M838 368A155 155 0 0 1 683 213" stroke="#c9a0ff" stroke-width="7" stroke-linecap="round" opacity=".75"/>
 <animateTransform attributeName="transform" type="rotate" from="0 838 213" to="360 838 213" dur="18s" repeatCount="indefinite"/>
 </g>
 </g>
</g>
<circle cx="838" cy="213" r="52" fill="#fcbaac" stroke="#ffdfcd" stroke-width="2"/>
<circle cx="838" cy="213" r="42" fill="#f9cfc5" stroke="#a76b9b" stroke-width=".8"/>
<text x="838" y="207" text-anchor="middle" font-size="13" fill="#6e3459" font-family="monospace" font-weight="700">SIDE A</text>
<text x="838" y="224" text-anchor="middle" font-size="11" fill="#6e3459" font-family="monospace">SHIFTIFY</text>
