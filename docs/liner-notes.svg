<text x="358" y="180">CSV · JSON · LINES</text>
<text x="358" y="203">Upload or paste</text>
<text x="358" y="221" font-size="11" fill="#a16d83">File → API</text>
<rect x="488" y="134" width="180" height="104" rx="10" fill="#f2def6" stroke="#bd93cd"/>
