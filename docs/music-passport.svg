<text x="14" y="23" fill="#9a5479" font-family="monospace" font-weight="700" font-size="10" letter-spacing="1">LIBRARY / PORTABLE</text>
<path d="M13 32H147" stroke="#e7bdd4"/>
<g fill="#745077" font-family="monospace" font-size="11">
<text x="14" y="53">01  •••••••••</text>
<text x="14" y="70">02  ••••••</text>
<text x="14" y="87">03  ••••••••</text>
</g>
